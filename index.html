<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>나랑 게임 할래?</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:
    radial-gradient(circle at 20% 20%, rgba(50,100,255,.15), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(0,180,255,.12), transparent 30%),
    linear-gradient(145deg,#050914,#091426,#050914);
  color:white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;
}

/* =========================
   카드
========================= */

.card{
  width:calc(100% - 32px);
  max-width:440px;
  max-height:90vh;

  background:rgba(8,16,32,.94);
  border:1px solid rgba(70,140,255,.25);
  border-radius:26px;

  padding:32px 24px;

  text-align:center;

  box-shadow:
    0 20px 60px rgba(0,0,0,.45),
    0 0 30px rgba(30,110,255,.08);

  position:relative;
  z-index:2;

  overflow:hidden;
}

.card.scroll{
  overflow-y:auto;
}

.card.no-scroll{
  overflow:hidden;
}

/* =========================
   장식
========================= */

.falling{
  position:fixed;
  top:-30px;
  font-size:20px;
  pointer-events:none;
  animation:fall linear forwards;
  z-index:1;
  opacity:.75;
}

@keyframes fall{
  from{
    transform:translateY(-30px) rotate(0deg);
  }
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}

/* =========================
   공통
========================= */

.game-icon{
  font-size:48px;
  margin-bottom:8px;
}

h1{
  font-size:25px;
  line-height:1.45;
  margin:8px 0 16px;
}

.description{
  color:#aeb9cb;
  font-size:14px;
  line-height:1.6;
  margin-bottom:22px;
}

button{
  border:0;
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  border-radius:14px;
  padding:14px 18px;
  cursor:pointer;
}

.yes,
.no,
.submit,
.continue-btn{
  width:100%;
}

.yes,
.submit,
.continue-btn{
  background:linear-gradient(135deg,#2377ff,#249eea);
  color:white;
  box-shadow:0 8px 20px rgba(30,120,255,.25);
}

.yes{
  margin-bottom:10px;
}

.no{
  background:#202a3b;
  color:#c8d0dd;
}

.small{
  color:#78869c;
  font-size:12px;
  margin-top:12px;
}

/* =========================
   첫 페이지
========================= */

.first-description{
  margin-top:-4px;
  margin-bottom:22px;
  line-height:1.45;
}

/* =========================
   두 번째 페이지
========================= */

.pleading-emoji{
  font-size:46px;
  margin-bottom:8px;
}

.pleading-text{
  font-size:18px;
  line-height:1.8;
  color:#dce5f3;
  margin-bottom:22px;
}

/* 도망가는 버튼 */
#runawayNo{
  transition:
    left .18s ease,
    top .18s ease,
    transform .18s ease;
}

/* =========================
   날짜 / 시간
========================= */

.date-icon{
  font-size:44px;
  margin-bottom:8px;
}

.section-title{
  text-align:left;
  color:#c8d5e8;
  font-size:14px;
  font-weight:700;
  margin:20px 0 9px;
}

.option-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.option{
  background:#111c30;
  border:1px solid #263751;
  color:#d9e2ef;
  padding:13px 8px;
  border-radius:13px;
  font-size:14px;
}

.option.selected{
  background:#164f9e;
  border-color:#4294ff;
  color:white;
  box-shadow:0 0 15px rgba(45,130,255,.18);
}

.time-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.time-option{
  background:#111c30;
  border:1px solid #263751;
  color:#d9e2ef;
  padding:12px 8px;
  border-radius:13px;
  font-size:14px;
}

.time-option.selected{
  background:#164f9e;
  border-color:#4294ff;
  color:white;
}

/* =========================
   게임 선택
========================= */

.game-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:18px;
}

.game-option{
  background:#111c30;
  border:1px solid #263751;
  color:#d9e2ef;
  padding:15px 8px;
  border-radius:14px;
  font-size:14px;
  min-height:52px;
}

.game-option.selected{
  background:#164f9e;
  border-color:#4294ff;
  color:white;
  box-shadow:0 0 15px rgba(45,130,255,.18);
}

.game-note{
  margin-top:17px;
  padding:12px 14px;
  border:1px solid #263751;
  border-radius:13px;
  background:#0e192b;
  color:#aebbd0;
  font-size:13px;
  line-height:1.5;
}

.selected-count{
  margin:13px 0;
  color:#8493aa;
  font-size:13px;
}

.continue-btn{
  margin-top:5px;
}

/* =========================
   모달
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);

  display:none;
  justify-content:center;
  align-items:center;

  z-index:20;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:calc(100% - 55px);
  max-width:360px;

  background:#0c1729;
  border:1px solid #2b4b78;
  border-radius:22px;

  padding:24px 20px;

  text-align:center;

  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal-emoji{
  font-size:40px;
  margin-bottom:5px;
}

.modal h2{
  margin:4px 0 10px;
  font-size:21px;
}

.modal p{
  margin:0 0 16px;
  color:#aebbd0;
  font-size:14px;
  line-height:1.6;
}

.modal button{
  width:100%;
  background:#2377ff;
  color:white;
}

/* =========================
   생성 중
========================= */

.loading-icon{
  font-size:44px;
  margin-bottom:12px;
}

.loading-text{
  color:#aebbd0;
  font-size:14px;
  margin-top:9px;
}

.progress{
  width:100%;
  height:10px;
  background:#172238;
  border-radius:20px;
  overflow:hidden;
  margin-top:22px;
}

.progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#2377ff,#35baff);
  transition:width .05s linear;
}

.percent{
  margin-top:9px;
  font-size:13px;
  color:#71819a;
}

/* =========================
   최종 초대장
========================= */

.final-page{
  overflow:hidden !important;
  max-height:90vh;
}

.final-card{
  background:#f8fbff;
  color:#182438;

  border-radius:23px;
  padding:25px 20px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.35);
}

.final-label{
  font-size:11px;
  letter-spacing:3px;
  color:#6b7890;
  font-weight:700;
  margin-bottom:5px;
}

.final-title{
  font-family:Georgia,serif;
  font-size:34px;
  font-weight:700;
  margin-bottom:22px;
}

.final-info{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:12px 4px;

  border-bottom:1px solid #e0e7ef;

  font-size:14px;
}

.final-info:last-child{
  border-bottom:0;
}

.final-info span:first-child{
  color:#8190a3;
}

.final-info span:last-child{
  font-weight:700;
  color:#263b59;
  text-align:right;
  max-width:65%;
}

.final-message{
  margin-top:18px;
  font-size:16px;
  font-weight:700;
  color:#dbe7f7;
  line-height:1.5;
}

/* =========================
   생성 데이터 게임 표시
========================= */

.final-games{
  display:flex;
  flex-direction:column;
  gap:3px;
}

/* =========================
   모바일
========================= */

@media(max-width:360px){
  .card{
    padding:27px 18px;
  }

  h1{
    font-size:22px;
  }

  .game-grid,
  .option-grid,
  .time-grid{
    gap:7px;
  }

  .game-option{
    padding:13px 5px;
  }
}
</style>
</head>

<body>

<div class="card no-scroll" id="card">

  <!-- =====================
       첫 페이지
  ====================== -->

  <section id="page1">

    <div class="game-icon">🎮</div>

    <h1>
      나랑 같이 게임 할래?
    </h1>

    <div class="description first-description">
      나랑 게임할 사람 찾고 있는데
    </div>

    <button class="yes" onclick="goPage(2)">
      좋아
    </button>

    <button class="no" onclick="goPage(3)">
      싫어
    </button>

  </section>

</div>


<!-- =========================
     3개 이상 선택 모달
========================= -->

<div class="modal-bg" id="modal">

  <div class="modal">

    <div class="modal-emoji">😎</div>

    <h2>
      감당 가능하겠니?
    </h2>

    <p>
      게임을 <strong id="modalCount">3개</strong>나 골랐네...<br>
      진짜 다 할 거야? 😎
    </p>

    <button onclick="closeModal()">
      응, 다 할 거야 😎
    </button>

  </div>

</div>


<script>

/* =========================
   페이지 관리
========================= */

const card = document.getElementById("card");

let selectedDate = "";
let selectedTime = "";
let selectedGames = [];

let runawayTexts = [
  "진짜로 싫어?!",
  "눌러보던가ㅋ",
  "안 돼😋",
  "못 누르지롱",
  "안 잡힐거야~",
  "거절합니다!"
];

let runawayIndex = 0;


/* =========================
   페이지 이동
========================= */

function goPage(page){

  if(page === 2){
    showFirstYesPage();
  }

  if(page === 3){
    showPleadingPage();
  }

  if(page === 4){
    showDatePage();
  }

  if(page === 5){
    showGamePage();
  }

  if(page === 6){
    showLoadingPage();
  }

  if(page === 7){
    showFinalPage();
  }
}


/* =========================
   좋아 → 날짜
========================= */

function showFirstYesPage(){

  card.className = "card no-scroll";

  card.innerHTML = `

    <div class="date-icon">💌</div>

    <h1>
      좋아!
    </h1>

    <div class="description">
      그럼 언제가 좋아?
    </div>

    <button class="yes" onclick="goPage(4)">
      날짜랑 시간 고르기
    </button>

  `;
}


/* =========================
   싫어 → 두 번째 페이지
========================= */

function showPleadingPage(){

  card.className = "card no-scroll";

  card.innerHTML = `

    <div class="pleading-emoji">
      ⁉️
    </div>

    <h1>
      잠깐만!
    </h1>

    <div class="pleading-text">
      나랑 게임 해주라...<br>
      열심히 할게
    </div>

    <button class="yes" onclick="goPage(4)">
      알겠어
    </button>

    <button class="no" id="runawayNo">
      싫어
    </button>

  `;

  const btn = document.getElementById("runawayNo");

  btn.addEventListener("mouseenter",moveRunaway);
  btn.addEventListener("touchstart",function(e){
    e.preventDefault();
    moveRunaway();
  });
}


/* =========================
   싫어 도망가기
========================= */

function moveRunaway(){

  const btn = document.getElementById("runawayNo");

  if(!btn) return;

  btn.textContent = runawayTexts[runawayIndex];

  runawayIndex++;

  if(runawayIndex >= runawayTexts.length){
    runawayIndex = 0;
  }

  const maxX =
    Math.max(
      10,
      window.innerWidth - btn.offsetWidth - 20
    );

  const maxY =
    Math.max(
      10,
      window.innerHeight - btn.offsetHeight - 20
    );

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  btn.style.position = "fixed";
  btn.style.left = x + "px";
  btn.style.top = y + "px";
}


/* =========================
   날짜 / 시간 페이지
========================= */

function showDatePage(){

  card.className = "card no-scroll";

  card.innerHTML = `

    <div class="date-icon">
      💌
    </div>

    <h1>
      언제가 좋아?
    </h1>

    <div class="section-title">
      날짜
    </div>

    <div class="option-grid">

      <button class="option"
        onclick="selectDate('2026년 9월 6일',this)">
        9월 6일
      </button>

      <button class="option"
        onclick="selectDate('2026년 9월 7일',this)">
        9월 7일
      </button>

    </div>

    <div class="section-title">
      시간
    </div>

    <div class="time-grid">

      <button class="time-option"
        onclick="selectTime('오후 9시',this)">
        오후 9시
      </button>

      <button class="time-option"
        onclick="selectTime('오후 10시',this)">
        오후 10시
      </button>

      <button class="time-option"
        onclick="selectTime('오후 11시',this)">
        오후 11시
      </button>

      <button class="time-option"
        onclick="selectTime('오전 12시',this)">
        오전 12시
      </button>

      <button class="time-option"
        onclick="selectTime('오전 1시',this)">
        오전 1시
      </button>

      <button class="time-option"
        onclick="selectTime('오전 2시',this)">
        오전 2시
      </button>

      <button class="time-option"
        onclick="selectTime('오전 3시',this)">
        오전 3시
      </button>

    </div>

    <button
      class="submit"
      style="margin-top:20px"
      onclick="confirmDate()">
      이때 좋아 💌
    </button>

  `;
}


/* =========================
   날짜 선택
========================= */

function selectDate(date,button){

  selectedDate = date;

  document
    .querySelectorAll(".option")
    .forEach(el => el.classList.remove("selected"));

  button.classList.add("selected");
}


/* =========================
   시간 선택
========================= */

function selectTime(time,button){

  selectedTime = time;

  document
    .querySelectorAll(".time-option")
    .forEach(el => el.classList.remove("selected"));

  button.classList.add("selected");
}


/* =========================
   날짜 확인
========================= */

function confirmDate(){

  if(!selectedDate || !selectedTime){

    alert("날짜랑 시간을 둘 다 골라줘! 🥺");
    return;
  }

  goPage(5);
}


/* =========================
   게임 선택
========================= */

const games = {

  "발로란트":
    "캐리는 못해도 트레이드 내줄게 🔫",

  "배틀 그라운드":
    "치킨은 못 먹어도 살아남아볼게 🍗",

  "리그오브레전드":
    "너가 어느 라인을 가도 서포터가 돼줄게 ✨️",

  "롤토체스":
    "필요한 덱 있으면 내가 다 팔아버릴게 💵",

  "오버워치":
    "전용 힐러가 되어줄 수 있긴한데... 💉",

  "로블록스":
    "오늘은 나도 잼민이가 되어줄게 🧱"

};


function showGamePage(){

  card.className = "card no-scroll";

  card.innerHTML = `

    <h1>
      무슨 게임이 하고싶어?
    </h1>

    <div class="game-grid">

      ${Object.keys(games).map(game => `

        <button
          class="game-option"
          onclick="selectGame('${game}',this)">
          ${game}
        </button>

      `).join("")}

    </div>

    <div class="game-note" id="gameNote">
      원하는 게임을 하나 이상 골라봐 👀
    </div>

    <div class="selected-count">
      선택한 게임 0개
    </div>

    <button
      class="continue-btn"
      onclick="finishGameSelection()">
      이 게임들 할래 🎮
    </button>

  `;
}


/* =========================
   게임 선택
========================= */

function selectGame(game,button){

  if(selectedGames.includes(game)){

    selectedGames =
      selectedGames.filter(g => g !== game);

    button.classList.remove("selected");

  }else{

    selectedGames.push(game);

    button.classList.add("selected");
  }

  updateGameInfo();
}


/* =========================
   게임 안내 업데이트
========================= */

function updateGameInfo(){

  const count =
    document.querySelector(".selected-count");

  const note =
    document.getElementById("gameNote");

  if(!count || !note) return;

  count.textContent =
    `선택한 게임 ${selectedGames.length}개`;

  if(selectedGames.length === 0){

    note.textContent =
      "원하는 게임을 하나 이상 골라봐 👀";

  }else if(selectedGames.length === 1){

    note.textContent =
      games[selectedGames[0]];

  }else{

    note.textContent =
      selectedGames
        .map(game => games[game])
        .join(" ");
  }
}


/* =========================
   3개 이상 선택 모달
========================= */

function finishGameSelection(){

  if(selectedGames.length === 0){

    alert("게임 하나는 골라줘! 🎮");
    return;
  }

  if(selectedGames.length >= 3){

    document.getElementById("modalCount")
      .textContent =
      selectedGames.length + "개";

    document
      .getElementById("modal")
      .classList.add("show");

    return;
  }

  goPage(6);
}


function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

  goPage(6);
}


/* =========================
   생성 중 페이지
========================= */

function showLoadingPage(){

  card.className = "card no-scroll";

  card.innerHTML = `

    <div class="loading-icon">
      ✨
    </div>

    <h1>
      초대장을 만드는 중...
    </h1>

    <div class="loading-text" id="loadingText">
      게임 약속을 정리하고 있어
    </div>

    <div class="progress">
      <div
        class="progress-bar"
        id="progressBar">
      </div>
    </div>

    <div class="percent" id="percent">
      0%
    </div>

  `;

  let progress = 0;

  const messages = [
    "게임 약속을 정리하고 있어",
    "날짜를 확인하고 있어",
    "게임을 고르고 있어",
    "초대장을 꾸미고 있어",
    "거의 다 됐어!"
  ];

  const interval =
    setInterval(() => {

      progress++;

      const bar =
        document.getElementById("progressBar");

      const percent =
        document.getElementById("percent");

      const text =
        document.getElementById("loadingText");

      if(bar)
        bar.style.width =
          progress + "%";

      if(percent)
        percent.textContent =
          progress + "%";

      if(text &&
         progress % 20 === 0){

        text.textContent =
          messages[
            Math.min(
              messages.length - 1,
              Math.floor(progress / 20)
            )
          ];
      }

      if(progress >= 100){

        clearInterval(interval);

        setTimeout(() => {
          goPage(7);
        },700);
      }

    },18);
}


/* =========================
   최종 페이지
========================= */

function showFinalPage(){

  card.className =
    "card final-page no-scroll";

  const gameText =
    selectedGames
      .map(game => `<div>${game}</div>`)
      .join("");

  card.innerHTML = `

    <div class="final-card">

      <div class="final-label">
        GAME INVITATION
      </div>

      <div class="final-title">
        초대장 💙
      </div>

      <div class="final-info">
        <span>날짜</span>
        <span>${selectedDate}</span>
      </div>

      <div class="final-info">
        <span>시간</span>
        <span>${selectedTime}</span>
      </div>

      <div class="final-info">
        <span>게임</span>

        <span class="final-games">
          ${gameText}
        </span>

      </div>

    </div>

    <div class="final-message">
      고마워, 캐리는 못해도 열심히 할게 💪
    </div>

  `;
}


/* =========================
   떨어지는 이모지
========================= */

const fallingEmojis = [
  "✨",
  "🌙",
  "⭐",
  "⚡"
];

function createFallingEmoji(){

  const emoji =
    document.createElement("div");

  emoji.className = "falling";

  emoji.textContent =
    fallingEmojis[
      Math.floor(
        Math.random() * fallingEmojis.length
      )
    ];

  emoji.style.left =
    Math.random() * 100 + "vw";

  emoji.style.animationDuration =
    (4 + Math.random() * 5) + "s";

  emoji.style.fontSize =
    (14 + Math.random() * 10) + "px";

  document.body.appendChild(emoji);

  setTimeout(() => {
    emoji.remove();
  },9000);
}

setInterval(createFallingEmoji,650);

</script>

</body>
</html>
