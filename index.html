<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>게임 약속</title>


<!-- ==================================================
     사진 저장용 html2canvas
================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>

/* =========================
   기본
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            145deg,
            #fce8f1,
            #eee8ff
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

    color: #3d3740;

    overflow: hidden;
}


/* =========================
   카드
========================= */

.card {

    width: calc(100% - 40px);

    max-width: 430px;

    max-height: 90vh;
    max-height: 90dvh;

    overflow-y: auto;

    background:
        rgba(255,255,255,.96);

    border-radius: 28px;

    padding: 30px 24px;

    text-align: center;

    box-shadow:
        0 15px 45px
        rgba(100,70,100,.15);

    position: relative;

    z-index: 2;
}

.card::-webkit-scrollbar {
    display: none;
}


/* =========================
   글씨
========================= */

.icon {

    font-size: 42px;

    margin-bottom: 8px;
}

h1 {

    font-size: 22px;

    line-height: 1.45;

    margin:
        8px 0 12px;
}

.desc {

    color: #817983;

    font-size: 13px;

    line-height: 1.7;

    margin-bottom: 22px;
}


/* =========================
   버튼 공통
========================= */

button {

    border: none;

    font-family: inherit;

    font-size: 14px;

    font-weight: 600;

    border-radius: 15px;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;

    touch-action: manipulation;

    user-select: none;
}


/* =========================
   첫 화면 버튼
========================= */

.button-row {

    display: flex;

    width: 100%;

    gap: 10px;

    justify-content: center;

    align-items: center;

    position: relative;
}


.button-row .yes,
.button-row .no {

    width: 150px;

    min-width: 150px;

    max-width: 150px;

    height: 48px;

    min-height: 48px;

    max-height: 48px;

    padding: 0;

    flex: 0 0 150px;

    display: flex;

    justify-content: center;

    align-items: center;

    white-space: nowrap;

    border-radius: 15px;

    overflow: hidden;
}


/* =========================
   좋아
========================= */

.yes {

    background: #f28eae;

    color: white;

    box-shadow:
        0 7px 18px
        rgba(242,142,174,.3);
}


/* =========================
   싫어
========================= */

.no {

    background: #f1eef1;

    color: #77717a;

    position: relative;

    width: 150px !important;

    min-width: 150px !important;

    max-width: 150px !important;

    height: 48px !important;

    min-height: 48px !important;

    max-height: 48px !important;

    padding: 0 !important;

    flex: 0 0 150px !important;

    border-radius: 15px !important;

    white-space: nowrap;

    overflow: hidden;

    transform-origin: center center;
}


/* =========================
   일반 다음 버튼
========================= */

.next {

    width: 100%;

    min-height: 48px;

    background: #f28eae;

    color: white;

    margin-top: 8px;

    padding: 14px;

    border-radius: 15px;
}


/* =========================
   날짜 / 시간
========================= */

.choice {

    text-align: left;

    margin: 16px 0;
}

.choice label {

    display: block;

    font-size: 13px;

    font-weight: 600;

    margin-bottom: 7px;
}

input {

    width: 100%;

    min-height: 48px;

    padding: 13px;

    border:
        1px solid #e4dce2;

    border-radius: 14px;

    font-family: inherit;

    font-size: 14px;

    background: white;
}


/* =========================
   게임 선택
========================= */

.game-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;

    margin: 18px 0;
}


.game {

    width: 100%;

    min-height: 52px;

    background: white;

    border:
        1px solid #eadfe5;

    color: #68616a;

    padding:
        11px 7px;

    font-size: 12px;

    transition:
        .15s ease;

    border-radius: 15px;
}


.game:active {

    transform: scale(.98);
}


.game.selected {

    background: #fff0f5;

    border:
        2px solid #f28eae;

    color: #e2769b;
}


.selected-text {

    min-height: 20px;

    font-size: 12px;

    color: #e2769b;

    margin-bottom: 8px;
}


/* =========================
   두 번째 페이지
========================= */

.middle-icon {

    font-size: 42px;

    margin-bottom: 8px;
}


/* =========================
   떨어지는 이모지
========================= */

.falling {

    position: fixed;

    top: -30px;

    z-index: 100;

    pointer-events: none;

    animation:
        fall linear forwards;
}


@keyframes fall {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    10% {

        opacity: .8;
    }

    100% {

        transform:
            translateY(110vh)
            rotate(30deg);

        opacity: 0;
    }
}


/* =========================
   마지막 페이지
========================= */

.promise {

    background: #fff6f9;

    border:
        1px solid #f4d5e1;

    border-radius: 18px;

    padding: 17px;

    margin: 18px 0;
}


.promise-title {

    color: #e985a8;

    font-size: 15px;

    font-weight: 700;

    margin-bottom: 10px;
}


.result {

    color: #817983;

    font-size: 13px;

    line-height: 2;
}


.final-message {

    color: #817983;

    font-size: 13px;

    line-height: 1.8;

    margin: 18px 0;
}


/* =========================
   사진 저장
========================= */

.save {

    width: 100%;

    min-height: 48px;

    background: #f28eae;

    color: white;

    padding: 14px;

    border-radius: 15px;
}


/* =========================
   링크 공유
========================= */

.share {

    width: 100%;

    min-height: 48px;

    background: #eee8ff;

    color: #8170a0;

    margin-top: 9px;

    padding: 14px;

    border-radius: 15px;
}


/* =========================
   수정
========================= */

.edit {

    width: 100%;

    min-height: 48px;

    background: white;

    color: #c4869d;

    border:
        1px solid #efc8d7;

    margin-top: 9px;

    padding: 14px;

    border-radius: 15px;
}


/* =========================
   작은 화면
========================= */

@media (max-width: 360px) {

    .card {

        width: calc(100% - 24px);

        padding: 26px 18px;
    }


    .button-row {

        gap: 8px;
    }


    .button-row .yes,
    .button-row .no {

        width: 140px;

        min-width: 140px;

        max-width: 140px;

        flex: 0 0 140px;
    }


    h1 {

        font-size: 20px;
    }
}

</style>

</head>


<body>


<div
    class="card"
    id="card">
</div>


<script>

/* ==================================================
   저장할 정보
================================================== */

let selectedDate = "";

let selectedTime = "";

let selectedGame = "";


/* ==================================================
   1. 첫 화면
================================================== */

function showHome() {

    clearFallingEmojis();


    document.getElementById(
        "card"
    ).innerHTML = `

        <div class="icon">
            🎮
        </div>


        <h1>
            혹시 나랑 같이<br>
            게임 할래?
        </h1>


        <div class="desc">
            나 요즘 같이 게임할 사람 찾고 있는데...<br>
            혹시 시간 괜찮으면 같이 해줄래?
        </div>


        <div class="button-row">

            <button
                type="button"
                class="yes"
                id="yesButton">

                좋아🥰

            </button>


            <button
                type="button"
                class="no"
                id="noButton">

                싫어🤪

            </button>

        </div>
    `;


    /* =========================
       좋아
    ========================= */

    const yesButton =
        document.getElementById(
            "yesButton"
        );


    yesButton.addEventListener(
        "click",
        function() {

            showMiddle();

        }
    );


    /* =========================
       싫어
    ========================= */

    const noButton =
        document.getElementById(
            "noButton"
        );


    /* 컴퓨터 */

    noButton.addEventListener(
        "mouseenter",
        moveNoButton
    );


    /* 모바일 */

    noButton.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            moveNoButton();

        },
        {
            passive: false
        }
    );
}


/* ==================================================
   싫어 버튼 도망
================================================== */

function moveNoButton() {

    const button =
        document.getElementById(
            "noButton"
        );


    if (!button) {

        return;
    }


    const buttonWidth =
        window.innerWidth <= 360
            ? 140
            : 150;


    const buttonHeight = 48;


    button.style.position =
        "fixed";


    button.style.width =
        buttonWidth + "px";


    button.style.minWidth =
        buttonWidth + "px";


    button.style.maxWidth =
        buttonWidth + "px";


    button.style.height =
        buttonHeight + "px";


    button.style.minHeight =
        buttonHeight + "px";


    button.style.maxHeight =
        buttonHeight + "px";


    button.style.padding =
        "0";


    button.style.flex =
        "0 0 " +
        buttonWidth +
        "px";


    button.style.borderRadius =
        "15px";


    button.style.boxSizing =
        "border-box";


    button.style.display =
        "flex";


    button.style.justifyContent =
        "center";


    button.style.alignItems =
        "center";


    button.style.whiteSpace =
        "nowrap";


    button.style.overflow =
        "hidden";


    button.style.zIndex =
        "9999";


    const margin = 15;


    const maxX =
        Math.max(
            margin,
            window.innerWidth -
            buttonWidth -
            margin
        );


    const maxY =
        Math.max(
            margin,
            window.innerHeight -
            buttonHeight -
            margin
        );


    const x =
        margin +
        Math.random() *
        Math.max(
            0,
            maxX - margin
        );


    const y =
        margin +
        Math.random() *
        Math.max(
            0,
            maxY - margin
        );


    button.style.left =
        x + "px";


    button.style.top =
        y + "px";
}


/* ==================================================
   2. 두 번째 페이지
================================================== */

function showMiddle() {

    clearFallingEmojis();


    document.getElementById(
        "card"
    ).innerHTML = `

        <div class="middle-icon">
            🥹
        </div>


        <h1>
            잠시만.. 좋다고?
        </h1>


        <div class="desc">
            난 사랑이 거절할 줄 알았어...
        </div>


        <button
            type="button"
            class="next"
            id="middleButton">

            알겠어, 해줄게!

        </button>
    `;


    document.getElementById(
        "middleButton"
    ).addEventListener(
        "click",
        showDate
    );


    startFallingEmojis();
}


/* ==================================================
   떨어지는 이모지
================================================== */

function startFallingEmojis() {

    const emojis = [

        "💕",
        "✨️",
        "🎀",
        "💗",
        "🌸"

    ];


    for (
        let i = 0;
        i < 15;
        i++
    ) {

        setTimeout(
            function() {

                const emoji =
                    document.createElement(
                        "div"
                    );


                emoji.className =
                    "falling";


                emoji.innerText =
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ];


                emoji.style.left =
                    Math.random() *
                    95 +
                    "vw";


                emoji.style.fontSize =
                    15 +
                    Math.random() *
                    10 +
                    "px";


                emoji.style.animationDuration =
                    3 +
                    Math.random() *
                    2 +
                    "s";


                document.body.appendChild(
                    emoji
                );


                setTimeout(
                    function() {

                        emoji.remove();

                    },
                    6000
                );

            },
            i * 300
        );
    }
}


/* ==================================================
   이모지 제거
================================================== */

function clearFallingEmojis() {

    document
        .querySelectorAll(
            ".falling"
        )
        .forEach(
            function(element) {

                element.remove();

            }
        );
}


/* ==================================================
   3. 날짜 / 시간
================================================== */

function showDate() {

    clearFallingEmojis();


    document.getElementById(
        "card"
    ).innerHTML = `

        <h1>
            그럼 언제가 편해?
        </h1>


        <div class="desc">
            같이 할 날짜랑 시간을 골라줘!
        </div>


        <div class="choice">

            <label>
                📅 날짜
            </label>


            <input
                type="date"
                id="date"
                min="2026-09-06"
                max="2026-09-07"
            >

        </div>


        <div class="choice">

            <label>
                ⏰ 시간
            </label>


            <input
                type="time"
                id="time"
            >

        </div>


        <button
            type="button"
            class="next"
            id="dateButton">

            이 시간으로 해줄게😏

        </button>


        <div
            style="
                font-size:11px;
                color:#99919a;
                margin-top:14px;
            ">

            9월 6일 또는 7일만 선택할 수 있어!

        </div>
    `;


    document.getElementById(
        "dateButton"
    ).addEventListener(
        "click",
        saveDate
    );
}


/* ==================================================
   날짜 / 시간 저장
================================================== */

function saveDate() {

    const date =
        document.getElementById(
            "date"
        ).value;


    const time =
        document.getElementById(
            "time"
        ).value;


    if (!date || !time) {

        alert(
            "날짜랑 시간을 둘 다 골라줘! 🥺"
        );

        return;
    }


    /* 혹시 직접 입력한 날짜가
       9월 6일 / 7일이 아닌 경우 방지 */

    if (
        date !== "2026-09-06" &&
        date !== "2026-09-07"
    ) {

        alert(
            "9월 6일이나 7일만 선택할 수 있어! 🥺"
        );

        return;
    }


    selectedDate =
        date;


    selectedTime =
        time;


    showGame();
}


/* ==================================================
   4. 게임 선택
================================================== */

function showGame() {

    document.getElementById(
        "card"
    ).innerHTML = `

        <h1>
            어떤 게임 할까? 🎮
        </h1>


        <div class="desc">
            같이 하고 싶은 게임을 골라줘!
        </div>


        <div class="game-grid">

            <button
                type="button"
                class="game"
                onclick="
                    pickGame(
                        this,
                        '발로란트'
                    )
                ">

                발로란트

            </button>


            <button
                type="button"
                class="game"
                onclick="
                    pickGame(
                        this,
                        '배그'
                    )
                ">

                배그

            </button>


            <button
                type="button"
                class="game"
                onclick="
                    pickGame(
                        this,
                        '리그오브레전드'
                    )
                ">

                리그오브레전드

            </button>


            <button
                type="button"
                class="game"
                onclick="
                    pickGame(
                        this,
                        '롤토체스'
                    )
                ">

                롤토체스

            </button>


            <button
                type="button"
                class="game"
                onclick="
                    pickGame(
                        this,
                        '오버워치'
                    )
                ">

                오버워치

            </button>


            <button
                type="button"
                class="game"
                onclick="
                    pickGame(
                        this,
                        '로블록스'
                    )
                ">

                로블록스

            </button>

        </div>


        <div
            class="selected-text"
            id="selectedGame">

            게임을 하나 골라줘!

        </div>


        <button
            type="button"
            class="next"
            onclick="finish()">

            이걸로 할게 ✨️

        </button>
    `;
}


/* ==================================================
   게임 선택
================================================== */

function pickGame(
    button,
    value
) {

    document
        .querySelectorAll(
            ".game"
        )
        .forEach(
            function(item) {

                item.classList.remove(
                    "selected"
                );

            }
        );


    button.classList.add(
        "selected"
    );


    selectedGame =
        value;


    document.getElementById(
        "selectedGame"
    ).innerText =
        "선택한 게임 · " +
        value;
}


/* ==================================================
   오전 / 오후
================================================== */

function formatTime(time) {

    const parts =
        time.split(":");


    let hour =
        Number(parts[0]);


    const minute =
        parts[1];


    const period =
        hour < 12
            ? "오전"
            : "오후";


    if (hour === 0) {

        hour = 12;

    }
    else if (hour > 12) {

        hour -= 12;

    }


    return (
        period +
        " " +
        hour +
        ":" +
        minute
    );
}


/* ==================================================
   5. 마지막 페이지
================================================== */

function finish() {

    if (!selectedGame) {

        alert(
            "하고 싶은 게임을 하나 골라줘! 🎮"
        );

        return;
    }


    const date =
        new Date(
            selectedDate +
            "T00:00:00"
        );


    const dateText =
        date.getFullYear() +
        "년 " +
        (date.getMonth() + 1) +
        "월 " +
        date.getDate() +
        "일";


    const timeText =
        formatTime(
            selectedTime
        );


    document.getElementById(
        "card"
    ).innerHTML = `

        <h1>
            그날 게임에서<br>
            꼭 만나기로 약속 🎮❤️
        </h1>


        <div class="promise">

            <div class="promise-title">
                우리의 게임 약속 💌
            </div>


            <div class="result">

                📅 ${dateText}<br>

                ⏰ ${timeText}<br>

                🎮 게임 · ${selectedGame}

            </div>

        </div>


        <div class="final-message">

            캐리는 못하지만 트레이드 내줄게

        </div>


        <button
            type="button"
            class="save"
            id="saveButton"
            onclick="saveImage()">

            📸 사진으로 저장하기

        </button>


        <button
            type="button"
            class="share"
            id="shareButton"
            onclick="shareLink()">

            🔗 링크 공유하기

        </button>


        <button
            type="button"
            class="edit"
            id="editButton"
            onclick="showDate()">

            시간 약속 수정하기

        </button>
    `;
}


/* ==================================================
   사진 저장
================================================== */

async function saveImage() {

    const card =
        document.getElementById(
            "card"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    const shareButton =
        document.getElementById(
            "shareButton"
        );


    const editButton =
        document.getElementById(
            "editButton"
        );


    if (!card) {

        return;
    }


    try {

        /*
           사진에 버튼이 같이 찍히지 않도록
           잠시 숨김
        */

        if (saveButton)
            saveButton.style.display = "none";

        if (shareButton)
            shareButton.style.display = "none";

        if (editButton)
            editButton.style.display = "none";


        const canvas =
            await html2canvas(
                card,
                {
                    backgroundColor: "#ffffff",
                    scale: 2,
                    useCORS: true
                }
            );


        /*
           버튼 다시 표시
        */

        if (saveButton)
            saveButton.style.display = "";

        if (shareButton)
            shareButton.style.display = "";

        if (editButton)
            editButton.style.display = "";


        const blob =
            await new Promise(
                function(resolve) {

                    canvas.toBlob(
                        resolve,
                        "image/png"
                    );

                }
            );


        if (!blob) {

            throw new Error(
                "이미지 생성 실패"
            );
        }


        const file =
            new File(
                [blob],
                "게임-약속.png",
                {
                    type:
                        "image/png"
                }
            );


        /*
           휴대폰에서 공유 기능이 지원되면
           갤러리 / 사진 앱 등으로
           바로 넘길 수 있게 함
        */

        if (
            navigator.canShare &&
            navigator.canShare({
                files: [file]
            })
        ) {

            await navigator.share({

                files: [file],

                title:
                    "우리의 게임 약속"

            });

            return;
        }


        /*
           공유 기능을 지원하지 않는 경우
           일반 PNG 다운로드
        */

        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "게임-약속.png";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            url
        );


        alert(
            "사진 저장이 완료됐어! 📸"
        );

    }
    catch (error) {

        /*
           에러가 나도 버튼은
           다시 보이게 함
        */

        if (saveButton)
            saveButton.style.display = "";

        if (shareButton)
            shareButton.style.display = "";

        if (editButton)
            editButton.style.display = "";


        /*
           사용자가 공유창을 닫은 경우는
           오류 알림을 띄우지 않음
        */

        if (
            error &&
            error.name ===
            "AbortError"
        ) {

            return;
        }


        console.error(
            error
        );


        alert(
            "사진 저장 중 문제가 생겼어 🥺"
        );
    }
}


/* ==================================================
   링크 공유
================================================== */

async function shareLink() {

    const url =
        window.location.href;


    const shareData = {

        title:
            "우리의 게임 약속 🎮",

        text:
            "나랑 같이 게임 할래? 🎮",

        url:
            url
    };


    /*
       휴대폰 공유 기능
    */

    if (
        navigator.share
    ) {

        try {

            await navigator.share(
                shareData
            );

        }
        catch (error) {

            /*
               사용자가 공유창을 닫은 경우
               아무것도 하지 않음
            */

            if (
                error.name !==
                "AbortError"
            ) {

                console.error(
                    error
                );

            }
        }

        return;
    }


    /*
       공유 기능이 없는 브라우저에서는
       링크를 클립보드에 복사
    */

    try {

        await navigator.clipboard.writeText(
            url
        );


        alert(
            "링크를 복사했어! 🔗"
        );

    }
    catch (error) {

        alert(
            "링크 복사에 실패했어 🥺"
        );
    }
}
