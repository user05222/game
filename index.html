<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Game Invitation</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #18243d 0%,
            #0b1020 45%,
            #05070d 100%
        );

    color: #f1f5ff;
}

/* ==============================
   전체 화면
============================== */

.screen {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    overflow: hidden;
}

.screen.active {
    display: flex;
}

/* ==============================
   카드
============================== */

.card {
    width: min(92vw, 520px);

    background: rgba(16, 24, 39, 0.96);

    border: 1px solid rgba(77, 163, 255, 0.2);

    border-radius: 26px;

    padding: 32px 25px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        0 0 35px rgba(77, 163, 255, 0.08);

    position: relative;
    z-index: 10;
}

/* ==============================
   로딩 화면
============================== */

.loading-card {
    background: transparent;
    border: none;
    box-shadow: none;
}

.loading-title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 28px;
}

.loading-text {
    color: #8d9bb5;
    font-size: 14px;
    margin-bottom: 15px;
}

.progress-wrap {
    width: 100%;
    height: 8px;

    background: #1b2538;

    border-radius: 999px;

    overflow: hidden;

    margin-bottom: 12px;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: #4da3ff;

    border-radius: 999px;

    transition: width 0.05s linear;
}

.progress-percent {
    font-size: 13px;
    color: #4da3ff;
    font-weight: 700;
}

/* ==============================
   첫 페이지
============================== */

.gamepad {
    font-size: 55px;
    margin-bottom: 18px;
}

.title {
    font-size: 29px;
    font-weight: 850;
    line-height: 1.4;
    margin-bottom: 30px;
}

.subtitle {
    color: #8d9bb5;
    font-size: 14px;
    margin-bottom: 25px;
}

/* ==============================
   버튼
============================== */

.button-row {
    display: flex;
    gap: 12px;
    justify-content: center;
}

button {
    border: none;
    outline: none;

    font-family: inherit;
    font-weight: 800;

    cursor: pointer;

    transition:
        transform 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
}

.main-btn {
    flex: 1;

    min-height: 54px;

    border-radius: 15px;

    font-size: 16px;

    background: #246bce;
    color: white;

    box-shadow:
        0 8px 25px rgba(36, 107, 206, 0.25);
}

.main-btn:hover {
    transform: translateY(-2px);
    background: #3381eb;
}

.no-btn {
    flex: 1;

    min-height: 54px;

    border-radius: 15px;

    font-size: 16px;

    background: #202b3f;
    color: #d9e1ef;
}

.no-btn:hover {
    background: #29364d;
}

/* ==============================
   두 번째 페이지
============================== */

.question-mark {
    font-size: 60px;
    margin-bottom: 20px;
}

.second-title {
    font-size: 27px;
    font-weight: 850;
    margin-bottom: 15px;
}

.second-text {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 30px;
}

/* 도망가는 버튼 */

.runaway-area {
    position: relative;

    width: 100%;
    height: 70px;

    margin-top: 8px;
}

.runaway-btn {
    position: absolute;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    width: 150px;
    height: 52px;

    border-radius: 15px;

    background: #202b3f;
    color: white;

    font-size: 15px;

    white-space: nowrap;
}

/* ==============================
   날짜 / 시간
============================== */

.question-title {
    font-size: 27px;
    font-weight: 850;
    margin-bottom: 28px;
}

.section-label {
    font-size: 14px;
    color: #8d9bb5;
    margin-bottom: 12px;
}

.date-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;

    margin-bottom: 28px;
}

.date-btn {
    min-height: 64px;

    border-radius: 16px;

    background: #151f31;
    color: #dfe8f7;

    border: 1px solid #25334b;

    font-size: 17px;
}

.date-btn.selected {
    background: #246bce;
    border-color: #4da3ff;
    color: white;

    box-shadow:
        0 0 20px rgba(77, 163, 255, 0.15);
}

/* 시간 */

.time-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 9px;

    margin-bottom: 26px;
}

.time-btn {
    min-height: 48px;

    border-radius: 12px;

    background: #151f31;
    color: #dfe8f7;

    border: 1px solid #25334b;

    font-size: 13px;
}

.time-btn.selected {
    background: #246bce;
    border-color: #4da3ff;
    color: white;
}

/* ==============================
   게임 선택
============================== */

.game-title {
    font-size: 27px;
    font-weight: 850;
    margin-bottom: 22px;
}

.game-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    width: 100%;

    margin-bottom: 25px;
}

.game-btn {
    min-height: 78px;

    border-radius: 16px;

    background: #151f31;

    border: 1px solid #25334b;

    color: #e8eef9;

    font-size: 15px;

    padding: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.game-btn.selected {
    background: #246bce;

    border-color: #4da3ff;

    color: white;

    box-shadow:
        0 0 18px rgba(77, 163, 255, 0.14);
}

/* ==============================
   게임 메모
============================== */

.game-memo {
    min-height: 44px;

    color: #8d9bb5;

    font-size: 13px;

    line-height: 1.5;

    margin-bottom: 18px;
}

/* ==============================
   3개 이상 모달
============================== */

.modal {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background: rgba(0, 0, 0, 0.68);

    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(88vw, 390px);

    background: #101827;

    border: 1px solid #334765;

    border-radius: 22px;

    padding: 30px 22px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.5);
}

.modal-title {
    font-size: 25px;
    font-weight: 900;

    margin-bottom: 12px;
}

.modal-text {
    color: #9eabc0;

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 23px;
}

.modal-btn {
    width: 100%;

    height: 50px;

    border-radius: 14px;

    background: #246bce;

    color: white;

    font-size: 15px;
}

/* ==============================
   생성 중 화면
============================== */

.create-title {
    font-size: 20px;

    font-weight: 850;

    letter-spacing: 1px;

    margin-bottom: 20px;
}

.create-text {
    color: #8d9bb5;

    font-size: 14px;

    margin-bottom: 15px;
}

/* ==============================
   마지막 초대장
============================== */

.invitation-screen {
    background: #05070d;
}

.invitation-card {
    width: min(92vw, 520px);

    min-height: 560px;

    background: white;

    color: #101827;

    border-radius: 28px;

    padding: 45px 30px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.45);
}

.invitation-word {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 43px;

    font-weight: 500;

    letter-spacing: 2px;

    margin-bottom: 55px;
}

.invitation-info {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 18px;
}

.info-row {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding-bottom: 15px;

    border-bottom: 1px solid #e5e8ee;

    font-size: 15px;
}

.info-label {
    color: #7a8495;

    font-size: 12px;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.info-value {
    font-weight: 750;

    max-width: 70%;

    text-align: right;

    line-height: 1.5;
}

/* ==============================
   마지막 액션 버튼
============================== */

.action-buttons {
    width: 100%;

    display: flex;

    gap: 10px;

    margin-top: 35px;
}

.action-btn {
    flex: 1;

    height: 48px;

    border-radius: 13px;

    background: #101827;

    color: white;

    font-size: 14px;
}

.action-btn:hover {
    background: #246bce;
}

/* ==============================
   떨어지는 이모지
============================== */

.falling {
    position: fixed;

    top: -40px;

    pointer-events: none;

    z-index: 2;

    animation: fall linear forwards;

    opacity: 0.75;
}

@keyframes fall {

    0% {
        transform:
            translateY(-50px)
            rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 0.8;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(360deg);
        opacity: 0;
    }
}

/* ==============================
   모바일
============================== */

@media (max-width: 420px) {

    .card {
        padding: 27px 20px;
    }

    .title {
        font-size: 25px;
    }

    .question-title,
    .game-title {
        font-size: 24px;
    }

    .time-grid {
        gap: 7px;
    }

    .time-btn {
        min-height: 45px;
        font-size: 12px;
    }

    .game-btn {
        min-height: 72px;
        font-size: 13px;
    }

    .invitation-card {
        min-height: 520px;
        padding: 35px 23px;
    }

    .invitation-word {
        font-size: 37px;
        margin-bottom: 48px;
    }
}

</style>
</head>


<body>


<!-- ==================================================
     PAGE 0
     처음 로딩
================================================== -->

<div class="screen active" id="page0">

    <div class="card loading-card">

        <div class="loading-title">
            GAME INVITATION SYSTEM
        </div>

        <div class="loading-text" id="loadingText">
            초대장을 준비하는 중...
        </div>

        <div class="progress-wrap">

            <div
                class="progress-bar"
                id="loadingBar">
            </div>

        </div>

        <div
            class="progress-percent"
            id="loadingPercent">
            0%
        </div>

    </div>

</div>


<!-- ==================================================
     PAGE 1
     첫 페이지
================================================== -->

<div class="screen" id="page1">

    <div class="card">

        <div class="gamepad">
            🎮
        </div>

        <div class="title">
            나랑 같이 게임 할래?
        </div>

        <div class="button-row">

            <button
                class="main-btn"
                onclick="goToPage(3)">
                좋아
            </button>

            <button
                class="no-btn"
                onclick="goToPage(2)">
                싫어
            </button>

        </div>

    </div>

</div>


<!-- ==================================================
     PAGE 2
     싫어 선택시
================================================== -->

<div class="screen" id="page2">

    <div class="card">

        <div class="question-mark">
            ⁉️
        </div>

        <div class="second-title">
            잠깐만!
        </div>

        <div class="second-text">
            정말 싫어? 나랑 같이 하자 😭
        </div>

        <div class="button-row">

            <button
                class="main-btn"
                onclick="goToPage(3)">
                알겠어
            </button>

        </div>

        <div class="runaway-area">

            <button
                class="runaway-btn"
                id="runawayButton">
                싫어
            </button>

        </div>

    </div>

</div>


<!-- ==================================================
     PAGE 3
     날짜 / 시간
================================================== -->

<div class="screen" id="page3">

    <div class="card">

        <div class="question-title">
            언제가 좋아?
        </div>


        <div class="section-label">
            날짜 선택
        </div>

        <div class="date-grid">

            <button
                class="date-btn"
                data-date="9월 6일"
                onclick="selectDate(this)">
                9월 6일
            </button>

            <button
                class="date-btn"
                data-date="9월 7일"
                onclick="selectDate(this)">
                9월 7일
            </button>

        </div>


        <div class="section-label">
            시간 선택
        </div>

        <div
            class="time-grid"
            id="timeGrid">
        </div>


        <button
            class="main-btn"
            onclick="nextToGame()">
            다음
        </button>

    </div>

</div>


<!-- ==================================================
     PAGE 4
     게임 선택
================================================== -->

<div class="screen" id="page4">

    <div class="card">

        <div class="game-title">
            나랑 어떤 게임이 하고싶어?
        </div>

        <div
            class="game-grid"
            id="gameGrid">

        </div>

        <div
            class="game-memo"
            id="gameMemo">
            원하는 게임 하나 이상 골라봐
        </div>

        <button
            class="main-btn"
            onclick="finishGameSelection()">
            선택 완료
        </button>

    </div>

</div>


<!-- ==================================================
     PAGE 4 → 3개 이상 모달
================================================== -->

<div
    class="modal"
    id="gameModal">

    <div class="modal-box">

        <div class="modal-title">
            응, 다 할거야 😎
        </div>

        <div class="modal-text">
            진짜 다 할 거야?<br>
            좋아. 어디 한번 해보자.
        </div>

        <button
            class="modal-btn"
            onclick="closeGameModal()">
            그래, 다 하자
        </button>

    </div>

</div>


<!-- ==================================================
     PAGE 5
     초대장 생성
================================================== -->

<div class="screen" id="page5">

    <div class="card loading-card">

        <div class="create-title">
            초대장을 생성하는 중...
        </div>

        <div class="create-text">
            잠시만 기다려줘
        </div>

        <div class="progress-wrap">

            <div
                class="progress-bar"
                id="createBar">
            </div>

        </div>

        <div
            class="progress-percent"
            id="createPercent">
            0%
        </div>

    </div>

</div>


<!-- ==================================================
     PAGE 6
     최종 초대장
================================================== -->

<div
    class="screen invitation-screen"
    id="page6">

    <div
        class="invitation-card"
        id="invitationCard">

        <div class="invitation-word">
            Invitation
        </div>

        <div
            class="invitation-info">

            <div class="info-row">

                <div class="info-label">
                    DATE
                </div>

                <div
                    class="info-value"
                    id="finalDate">
                </div>

            </div>


            <div class="info-row">

                <div class="info-label">
                    TIME
                </div>

                <div
                    class="info-value"
                    id="finalTime">
                </div>

            </div>


            <div class="info-row">

                <div class="info-label">
                    GAME
                </div>

                <div
                    class="info-value"
                    id="finalGame">
                </div>

            </div>

        </div>


        <div class="action-buttons">

            <button
                class="action-btn"
                onclick="saveImage()">
                이미지 저장
            </button>

            <button
                class="action-btn"
                onclick="sharePage()">
                초대장 공유
            </button>

        </div>

    </div>

</div>


<script>

/* ==================================================
   기본 변수
================================================== */

let selectedDate = "";
let selectedTime = "";
let selectedGames = [];

let runawayCount = 0;


/* ==================================================
   페이지 이동
================================================== */

function goToPage(pageNumber) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document
        .getElementById("page" + pageNumber)
        .classList.add("active");

    if (pageNumber === 2) {
        resetRunawayButton();
    }

    if (pageNumber === 3) {
        createTimeButtons();
    }

    if (pageNumber === 4) {
        createGameButtons();
    }

    if (pageNumber === 6) {
        startFallingEmojis();
    }
}


/* ==================================================
   처음 로딩
================================================== */

let loadingProgress = 0;

const loadingInterval = setInterval(() => {

    loadingProgress++;

    document.getElementById("loadingBar").style.width =
        loadingProgress + "%";

    document.getElementById("loadingPercent").innerText =
        loadingProgress + "%";


    if (loadingProgress >= 35) {

        document.getElementById("loadingText").innerText =
            "게임 초대장을 불러오는 중...";
    }


    if (loadingProgress >= 70) {

        document.getElementById("loadingText").innerText =
            "초대장을 거의 다 만들었어...";
    }


    if (loadingProgress >= 100) {

        clearInterval(loadingInterval);

        document.getElementById("loadingText").innerText =
            "초대 준비 완료!";

        setTimeout(() => {

            goToPage(1);

        }, 450);

    }

}, 13);


/* ==================================================
   도망가는 싫어 버튼
================================================== */

const runawayMessages = [

    "진짜로 싫어?!",
    "눌러보던가ㅋ",
    "안 돼😋",
    "못 누르지롱",
    "안 잡힐거야~",
    "거절합니다!"

];


function resetRunawayButton() {

    runawayCount = 0;

    const button =
        document.getElementById("runawayButton");

    if (!button) return;

    button.style.transform =
        "translateX(-50%) translateY(0)";

    button.innerText = "싫어";

}


/* 마우스를 올렸을 때 */

document.addEventListener("mouseover", function(e) {

    if (
        e.target &&
        e.target.id === "runawayButton"
    ) {

        moveRunawayButton();
    }

});


/* 모바일 터치 */

document.addEventListener("touchstart", function(e) {

    if (
        e.target &&
        e.target.id === "runawayButton"
    ) {

        e.preventDefault();

        moveRunawayButton();
    }

}, { passive: false });


function moveRunawayButton() {

    const button =
        document.getElementById("runawayButton");

    if (!button) return;


    button.innerText =
        runawayMessages[
            runawayCount %
            runawayMessages.length
        ];

    runawayCount++;


    const x =
        Math.floor(Math.random() * 220) - 110;

    const y =
        Math.floor(Math.random() * 100) - 50;


    button.style.transform =
        `translate(calc(-50% + ${x}px), ${y}px)`;

}


/* ==================================================
   날짜 선택
================================================== */

function selectDate(button) {

    document
        .querySelectorAll(".date-btn")
        .forEach(btn => {
            btn.classList.remove("selected");
        });

    button.classList.add("selected");

    selectedDate =
        button.dataset.date;
}


/* ==================================================
   시간 생성
   오후 8시 ~ 오전 3시
================================================== */

function createTimeButtons() {

    const grid =
        document.getElementById("timeGrid");

    grid.innerHTML = "";


    const times = [

        {
            value: "오후 8시",
            hour: 20
        },

        {
            value: "오후 9시",
            hour: 21
        },

        {
            value: "오후 10시",
            hour: 22
        },

        {
            value: "오후 11시",
            hour: 23
        },

        {
            value: "오전 12시",
            hour: 0
        },

        {
            value: "오전 1시",
            hour: 1
        },

        {
            value: "오전 2시",
            hour: 2
        },

        {
            value: "오전 3시",
            hour: 3
        }

    ];


    times.forEach(time => {

        const button =
            document.createElement("button");

        button.className =
            "time-btn";

        button.innerText =
            time.value;

        button.onclick = function() {

            document
                .querySelectorAll(".time-btn")
                .forEach(btn => {
                    btn.classList.remove("selected");
                });

            button.classList.add("selected");

            selectedTime =
                time.value;
        };

        grid.appendChild(button);

    });

}


/* ==================================================
   날짜 / 시간 → 게임 선택
================================================== */

function nextToGame() {

    if (!selectedDate) {

        alert("날짜를 골라줘!");

        return;
    }


    if (!selectedTime) {

        alert("시간을 골라줘!");

        return;
    }


    goToPage(4);
}


/* ==================================================
   게임 데이터
================================================== */

const games = [

    {
        name: "발로란트",

/* ==================================================
   게임 버튼 생성
================================================== */

function createGameButtons() {

    const grid =
        document.getElementById("gameGrid");

    grid.innerHTML = "";

    selectedGames = [];


    games.forEach((game, index) => {

        const button =
            document.createElement("button");

        button.className =
            "game-btn";

        button.innerText =
            game.name;

        button.dataset.index =
            index;


        button.onclick = function() {

            toggleGame(
                index,
                button
            );

        };


        grid.appendChild(button);

    });


    document.getElementById("gameMemo").innerText =
        "원하는 게임 하나 이상 골라봐";

}


/* ==================================================
   게임 선택
================================================== */

function toggleGame(index, button) {

    const game =
        games[index];


    const existingIndex =
        selectedGames.indexOf(index);


    if (existingIndex !== -1) {

        selectedGames.splice(
            existingIndex,
            1
        );

        button.classList.remove("selected");

    }

    else {

        selectedGames.push(index);

        button.classList.add("selected");

    }


    /* 선택된 게임 메모 */

    if (selectedGames.length === 0) {

        document.getElementById("gameMemo").innerText =
            "원하는 게임 하나 이상 골라봐";

    }

    else {

        const latest =
            selectedGames[
                selectedGames.length - 1
            ];

        document.getElementById("gameMemo").innerText =
            games[latest].memo;

    }


    /* 3개 이상 */

    if (selectedGames.length === 3) {

        document
            .getElementById("gameModal")
            .classList.add("show");

    }

}


/* ==================================================
   모달 닫기
================================================== */

function closeGameModal() {

    document
        .getElementById("gameModal")
        .classList.remove("show");

}


/* ==================================================
   게임 선택 완료
================================================== */

function finishGameSelection() {

    if (selectedGames.length === 0) {

        alert("게임을 하나 이상 골라줘!");

        return;
    }


    startInvitationCreation();

}


/* ==================================================
   초대장 생성 게이지
================================================== */

function startInvitationCreation() {

    goToPage(5);


    let progress = 0;

    const bar =
        document.getElementById("createBar");

    const percent =
        document.getElementById("createPercent");


    bar.style.width = "0%";

    percent.innerText = "0%";


    const interval =
        setInterval(() => {

            progress++;

            bar.style.width =
                progress + "%";

            percent.innerText =
                progress + "%";


            if (progress >= 100) {

                clearInterval(interval);


                setTimeout(() => {

                    makeFinalInvitation();

                }, 350);

            }

        }, 15);

}


/* ==================================================
   최종 초대장
================================================== */

function makeFinalInvitation() {

    document.getElementById("finalDate").innerText =
        selectedDate;


    document.getElementById("finalTime").innerText =
        selectedTime;


    const gameNames =
        selectedGames.map(index => games[index].name);


    document.getElementById("finalGame").innerText =
        gameNames.join(" / ");


    goToPage(6);

}

let fallingInterval = null;


function startFallingEmojis() {

    if (fallingInterval) return;


    const emojis = [
        "✨",
        "🌙",
        "⭐",
        "⚡"
    ];


    fallingInterval =
        setInterval(() => {

            createFallingEmoji(emojis);

        }, 700);

}


function createFallingEmoji(emojis) {

    const element =
        document.createElement("div");

    element.className =
        "falling";


    element.innerText =
        emojis[
            Math.floor(
                Math.random() *
                emojis.length
            )
        ];


    element.style.left =
        Math.random() * 100 + "vw";


    element.style.fontSize =
        (12 + Math.random() * 12) + "px";


    element.style.animationDuration =
        (4 + Math.random() * 4) + "s";


    document.body.appendChild(element);


    setTimeout(() => {

        element.remove();

    }, 9000);

}


/* ==================================================
   이미지 저장
================================================== */

async function saveImage() {

    const card =
        document.getElementById("invitationCard");

    const actions =
        document.querySelector(".action-buttons");


    actions.style.display = "none";


    try {

        const canvas =
            await html2canvas(
                card,
                {
                    backgroundColor: "#ffffff",
                    scale: 2
                }
            );


        canvas.toBlob(async blob => {

            const file =
                new File(
                    [blob],
                    "게임-초대장.png",
                    {
                        type: "image/png"
                    }
                );


            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files: [file]
                })
            ) {

                try {

                    await navigator.share({
                        files: [file],
                        title: "게임 초대장"
                    });

                }

                catch (error) {

                    console.log(error);

                }

            }

            else {

                const link =
                    document.createElement("a");

                link.download =
                    "게임-초대장.png";

                link.href =
                    URL.createObjectURL(blob);

                link.click();

                URL.revokeObjectURL(
                    link.href
                );

            }

        });

    }

    catch (error) {

        alert("이미지 저장에 실패했어.");

        console.error(error);

    }


    setTimeout(() => {

        actions.style.display = "flex";

    }, 500);

}


/* ==================================================
   초대장 공유
================================================== */

async function sharePage() {

    const shareData = {

        title: "게임 초대장",

        text:
            "나랑 같이 게임 할래?",

        url:
            window.location.href

    };


    if (
        navigator.share
    ) {

        try {

            await navigator.share(
                shareData
            );

        }

        catch (error) {

            console.log(error);

        }

    }

    else {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );

            alert(
                "초대장 링크를 복사했어!"
            );

        }

        catch (error) {

            alert(
                "링크 복사에 실패했어."
            );

        }

    }

}
